name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s tests -v
      - run: python skills/origin-scientific-plotting/scripts/origin_plot.py --spec examples/figures.json --validate-only
